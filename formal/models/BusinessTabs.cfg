CONSTANTS
  Readers = {"reader-a", "reader-b"}
  SessionIds = {"session-a", "session-b"}
  Groups = {"CURRENT_LOANS", "RESERVATIONS", "HISTORY"}
  BorrowKinds = {"RESERVATION", "LOAN"}
  OtherKinds = {"FINE", "ORDER"}
  ReservationStatuses = {"AWAIT", "CONFIRMED", "MANUAL_HANDLING", "WAITLIST"}
  LoanStatuses = {"LENT", "RETURNED", "RETURN_ABNORMAL", "NOT_BORROWED"}
  HistoryStatuses = {"RETURNED", "RETURN_ABNORMAL", "NOT_BORROWED"}
  CursorValues = {"START", "loan-next", "reservation-next", "history-next"}
  RequestGenerations = {0, 1, 2}
  SessionGenerations = {0, 1}
  StartCursor = "START"
  NoCursor = "NO_CURSOR"
  MaxRequestGeneration = 2
  MaxSessionGeneration = 1

INIT Init
NEXT Next

INVARIANT TypeOK
INVARIANT InvGroupPartition
INVARIANT InvPageProjectionInOwnGroup
INVARIANT InvPageCursorStateCoherent
INVARIANT InvVisibleRowsBelongToActiveGroup
INVARIANT InvHistoryCacheEmptyWhileInvalidated
INVARIANT InvReservationCacheEmptyWhileInvalidated
INVARIANT InvCanceledReservationInHistory
