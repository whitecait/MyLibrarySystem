# C1 measurement scaffold overlay. Use together with the base file:
#   docker compose -f compose.yaml -f compose.observability.yaml -p <project> up -d
# Without this overlay the base project behavior is unchanged (B1 evidence stays valid).
# Image digests were captured at first pull on 2026-09-10; pin bumps require a
# new verification round.
services:
  backend:
    environment:
      # Trace export activates only under this overlay; the base project sends nothing.
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      # Boot defaults to 10% sampling; the scaffold needs every request exported.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'
      # Request completion logs carry the MDC traceId used for trace correlation.
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: DEBUG
  prometheus:
    image: prom/prometheus:v3.4.2@sha256:3b1d5be5c3eef4f027665ddaa3b1a7de8a58d96a0a6de5dd45629afd267ecaf0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-0}:9090'
  grafana:
    image: grafana/grafana:12.0.0@sha256:263cbefd5d9b179893c47c415daab4da5c1f3d6770154741eca4f45c81119884
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in the environment}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-0}:3000'
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0@sha256:e94cfd92357aa21f4101dda3c0c01f90e6f24115ba91b263c4d09fed7911ae68
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
