spring:
  application:
    name: library-server
  jackson:
    deserialization:
      # OpenAPI 请求 schema 均 additionalProperties:false：未知字段按字段错误拒绝
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/library}
    username: ${DB_USERNAME:library}
    password: ${DB_PASSWORD:library}
  flyway:
    locations: classpath:db/migration,classpath:db/infra-migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # C1 scaffold buckets: enable p95/p99 computation instead of name-only charts.
      slo:
        http.server.requests: 10ms,25ms,50ms,100ms,200ms,500ms,1s,2s
  tracing:
    # Trace export only activates when MANAGEMENT_OTLP_TRACING_ENDPOINT is provided
    # (observability environment); otherwise spans stay in-process and nothing is sent.
    enabled: ${TRACING_ENABLED:true}

logging:
  pattern:
    # Correlate application log lines with OTel traces via MDC traceId/spanId.
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %m%n"

library:
  ai:
    endpoint-url: ${AI_ENDPOINT_URL:}
    model: ${AI_MODEL:}
    api-key: ${AI_API_KEY:}
    account-daily-limit: ${AI_ACCOUNT_DAILY_LIMIT:10}
    visitor-daily-limit: ${AI_VISITOR_DAILY_LIMIT:10}
    max-rounds: ${AI_MAX_ROUNDS:4}
    retry-budget: ${AI_RETRY_BUDGET:2}
    endpoint-timeout: ${AI_ENDPOINT_TIMEOUT:8s}
