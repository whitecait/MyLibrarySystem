name: Engineering foundation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: library-frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: library-frontend/package-lock.json
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run lint:check
      - run: npm run test:ci -- --reporter=default --reporter=junit --outputFile=reports/vitest.xml
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-reports
          path: library-frontend/reports/
          retention-days: 14
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: library-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
          cache: maven
      - run: docker version && docker info
      - run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-reports
          path: library-server/target/surefire-reports/
          retention-days: 14
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/test-check-migrations.py
      - run: python3 scripts/delivery/test_manage.py
      - run: python3 scripts/delivery/test_package.py
      - name: Verify two empty volumes and retained-volume restart
        run: bash scripts/verify-compose.sh
        env:
          EVIDENCE_DIR: artifacts/compose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compose-evidence
          path: artifacts/compose/
          retention-days: 14
  observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/test-observability-env.sh
      - name: Run C1 measurement scaffold verification
        run: bash scripts/verify-observability.sh
        env:
          EVIDENCE_DIR: artifacts/c1
          SKIP_EXISTING_GATES: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: c1-observability-evidence
          path: artifacts/c1/
          retention-days: 14

  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Check bounded safety, designated probes and fail-closed runner
        run: python3 formal/verify.py --output-dir artifacts/formal
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: formal-evidence
          path: artifacts/formal/
          retention-days: 14
