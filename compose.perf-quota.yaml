# RA-0013 §11 environment [E] per-container quotas (MLS-DEC-0025, 2026-09-10).
# Quotas are ceilings, not runtime requirements; totals are 4 CPU and about
# 7.25 GiB. Apply on top of the base and observability overlays:
#
#   docker compose -f compose.yaml -f compose.observability.yaml \
#     -f compose.perf-quota.yaml -p <perf-project> up -d
#
# The k6 service is injected container-side (profiles [perf], so plain up
# never starts it). Its image tag@digest is captured at first pull on the
# execution host and pinned via K6_IMAGE_TAG, following the
# compose.observability.yaml digest-freeze precedent.
services:
  backend:
    environment:
      # RA-0013 §11 saturation check reads tomcat_threads_busy /
      # tomcat_threads_config_max from the backend /actuator/prometheus
      # extract (thread-pool dimension). Spring Boot 3 dropped its own
      # Tomcat metrics auto-configuration; Micrometer's TomcatMetrics
      # reads the thread pools over JMX, so the Tomcat MBean registry must
      # be enabled before the connector starts. Relaxed binding maps this
      # to server.tomcat.mbeanregistry.enabled. Scope: perf-quota overlay
      # only — the base and observability stacks are unchanged.
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: 'true'
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2560m
  database:
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2048m
  frontend:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256m
  k6:
    image: grafana/k6:${K6_IMAGE_TAG:?Capture tag@digest at first pull and pin K6_IMAGE_TAG}
    profiles: [perf]
    # The k6 image defaults to uid 12345, which cannot write the summary
    # exports into the host-owned ./e2e/perf/out bind mount; match the host
    # user that owns the checkout.
    user: '1000:1000'
    volumes:
      - ./e2e/perf:/scripts:ro
      # outputs are written through a writable submount (k6 summary exports)
      - ./e2e/perf/out:/scripts/out
    # Output files land in e2e/perf/out (gitignored); K6_OUTPUT_DIR is the
    # in-container path. Scenario vars are list-style passthrough: compose
    # only forwards host variables that are declared on the service, so
    # run-protocol.sh's `env KEY=... docker compose run` reaches the
    # container only via these entries (BASE_URL/RUN_ID default inside
    # e2e/perf/lib/common.js).
    environment:
      - K6_OUTPUT_DIR=/scripts/out
      - BASE_URL
      - RUN_ID
      - RETRIEVAL_SET
      - PROBE_READERS
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
  prometheus:
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1024m
  grafana:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
  otel-collector:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512m
