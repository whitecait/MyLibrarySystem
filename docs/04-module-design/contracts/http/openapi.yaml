openapi: 3.1.0
info:
  title: MyLibrarySystem HTTP Contract
  version: 3.0.0
  description: >-
    Frontend and backend shared structural contract. Business semantics, permissions,
    idempotency and transaction guarantees remain normative in MLS-DOC-MD-0003.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - {name: Identity}
  - {name: Catalog}
  - {name: Circulation}
  - {name: Settlement}
  - {name: Review}
  - {name: Query}
  - {name: Delivery}
  - {name: AI}

paths:
  /auth/registrations:
    post: {tags: [Identity], operationId: registerReader, security: [], x-permission: PUBLIC, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/RegistrationSessionCookie'}], requestBody: {$ref: '#/components/requestBodies/Registration'}, responses: {'200': {$ref: '#/components/responses/Registration'}, '429': {$ref: '#/components/responses/Error'}, default: {$ref: '#/components/responses/Error'}}}
  /auth/sessions:
    post: {tags: [Identity], operationId: createSession, security: [], x-permission: PUBLIC, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Session'}, responses: {'200': {$ref: '#/components/responses/Session'}, default: {$ref: '#/components/responses/Error'}}}
  /auth/sessions/current:
    delete: {tags: [Identity], operationId: endCurrentSession, x-permission: AUTHENTICATED, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/Ended'}, default: {$ref: '#/components/responses/Error'}}}
  /accounts:
    get: {tags: [Identity], operationId: listAccounts, x-permission: ADMIN, parameters: [{$ref: '#/components/parameters/Role'}, {$ref: '#/components/parameters/AccountStatus'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/AccountPage'}, default: {$ref: '#/components/responses/Error'}}}
  /accounts/{accountId}/change-requests:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    post: {tags: [Identity], operationId: requestAccountChange, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/AccountChange'}, responses: {'200': {$ref: '#/components/responses/ReviewReference'}, default: {$ref: '#/components/responses/Error'}}}
  /accounts/{accountId}/password-reset:
    parameters: [{$ref: '#/components/parameters/AccountId'}]
    post: {tags: [Identity], operationId: resetPassword, x-permission: LIBRARIAN_OR_ADMIN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Reason'}, responses: {'200': {$ref: '#/components/responses/PasswordReset'}, default: {$ref: '#/components/responses/Error'}}}
  /readers/{readerId}/status:
    parameters: [{$ref: '#/components/parameters/ReaderId'}]
    patch: {tags: [Identity], operationId: changeReaderStatus, x-permission: LIBRARIAN_OR_ADMIN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/ReaderStatusChange'}, responses: {'200': {$ref: '#/components/responses/Reader'}, default: {$ref: '#/components/responses/Error'}}}
  /titles:
    get: {tags: [Catalog], operationId: searchTitles, security: [], x-permission: PUBLIC, parameters: [{$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/Category'}, {$ref: '#/components/parameters/Availability'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/TitlePage'}, default: {$ref: '#/components/responses/Error'}}}
    post: {tags: [Catalog], operationId: createTitle, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/CreateTitle'}, responses: {'200': {$ref: '#/components/responses/Title'}, default: {$ref: '#/components/responses/Error'}}}
  /titles/{titleId}:
    parameters: [{$ref: '#/components/parameters/TitleId'}]
    get: {tags: [Catalog], operationId: getTitle, security: [], x-permission: PUBLIC, responses: {'200': {$ref: '#/components/responses/Title'}, default: {$ref: '#/components/responses/Error'}}}
    patch: {tags: [Catalog], operationId: updateTitle, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/UpdateTitle'}, responses: {'200': {$ref: '#/components/responses/Title'}, default: {$ref: '#/components/responses/Error'}}}
    delete: {tags: [Catalog], operationId: removeTitle, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/VersionReason'}, responses: {'200': {$ref: '#/components/responses/Removed'}, default: {$ref: '#/components/responses/Error'}}}
  /titles/{titleId}/content:
    parameters: [{$ref: '#/components/parameters/TitleId'}]
    get: {tags: [Catalog], operationId: getReadingContent, security: [], x-permission: PUBLIC, parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/ReadingContent'}, default: {$ref: '#/components/responses/Error'}}}
  /titles/{titleId}/copies:
    parameters: [{$ref: '#/components/parameters/TitleId'}]
    post: {tags: [Circulation], operationId: createCopy, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/CreateCopy'}, responses: {'200': {$ref: '#/components/responses/Copy'}, default: {$ref: '#/components/responses/Error'}}}
  /copies:
    get: {tags: [Circulation], operationId: listCopies, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/TitleIdQuery'}, {$ref: '#/components/parameters/CopyStatus'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/CopyPage'}, default: {$ref: '#/components/responses/Error'}}}
  /copies/{copyId}:
    parameters: [{$ref: '#/components/parameters/CopyId'}]
    patch: {tags: [Circulation], operationId: changeCopyState, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/CopyAction'}, responses: {'200': {$ref: '#/components/responses/Copy'}, default: {$ref: '#/components/responses/Error'}}}
  /titles/{titleId}/reservation-calendar:
    parameters: [{$ref: '#/components/parameters/TitleId'}]
    get: {tags: [Circulation], operationId: getReservationCalendar, security: [], x-permission: PUBLIC, parameters: [{$ref: '#/components/parameters/FromDate'}, {$ref: '#/components/parameters/ToDate'}], responses: {'200': {$ref: '#/components/responses/ReservationCalendar'}, default: {$ref: '#/components/responses/Error'}}}
  /reservations:
    post: {tags: [Circulation], operationId: reserveTitle, x-permission: READER_SELF_OR_LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Reservation'}, responses: {'200': {$ref: '#/components/responses/Reservation'}, default: {$ref: '#/components/responses/Error'}}}
  /reservations/{txId}/cancel:
    parameters: [{$ref: '#/components/parameters/TxId'}]
    post: {tags: [Circulation], operationId: cancelReservation, x-permission: READER_SELF_OR_LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Reason'}, responses: {'200': {$ref: '#/components/responses/Transaction'}, default: {$ref: '#/components/responses/Error'}}}
  /walk-in-loans:
    post: {tags: [Circulation], operationId: createWalkInLoans, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/WalkInLoan'}, responses: {'200': {$ref: '#/components/responses/LoanBatch'}, default: {$ref: '#/components/responses/Error'}}}
  /pickups/{txId}/claim:
    parameters: [{$ref: '#/components/parameters/TxId'}]
    post: {tags: [Circulation], operationId: claimPickup, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/ClaimPickup'}, responses: {'200': {$ref: '#/components/responses/Transaction'}, default: {$ref: '#/components/responses/Error'}}}
  /transactions/{txId}/manual-actions:
    parameters: [{$ref: '#/components/parameters/TxId'}]
    post: {tags: [Circulation], operationId: applyManualAction, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/ManualAction'}, responses: {'200': {$ref: '#/components/responses/Transaction'}, default: {$ref: '#/components/responses/Error'}}}
  /loans/{txId}/renewals:
    parameters: [{$ref: '#/components/parameters/TxId'}]
    post: {tags: [Circulation], operationId: renewLoan, x-permission: READER_SELF, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Renewal'}, responses: {'200': {$ref: '#/components/responses/Renewal'}, default: {$ref: '#/components/responses/Error'}}}
  /returns:
    post: {tags: [Circulation], operationId: returnCopy, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Return'}, responses: {'200': {$ref: '#/components/responses/Return'}, default: {$ref: '#/components/responses/Error'}}}
  /closing/runs:
    post: {tags: [Circulation], operationId: runClosing, x-permission: SYSTEM, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/BusinessDate'}, responses: {'200': {$ref: '#/components/responses/ClosingRun'}, default: {$ref: '#/components/responses/Error'}}}
  /closing/reopen:
    post: {tags: [Circulation], operationId: reopenBusinessDate, x-permission: ADMIN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/BusinessDate'}, responses: {'200': {$ref: '#/components/responses/Reopened'}, default: {$ref: '#/components/responses/Error'}}}
  /fines:
    get: {tags: [Settlement], operationId: listFines, x-permission: READER_SELF_OR_LIBRARIAN, parameters: [{$ref: '#/components/parameters/ReaderIdQuery'}, {$ref: '#/components/parameters/FineStatus'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/FinePage'}, default: {$ref: '#/components/responses/Error'}}}
  /fines/{fineId}/orders:
    parameters: [{$ref: '#/components/parameters/FineId'}]
    post: {tags: [Settlement], operationId: createOrder, x-permission: READER_SELF, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/Order'}, default: {$ref: '#/components/responses/Error'}}}
  /orders/occupied:
    get: {tags: [Settlement], operationId: listOccupiedOrders, x-permission: READER_SELF, parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/OrderPage'}, default: {$ref: '#/components/responses/Error'}}}
  /orders/{orderId}:
    parameters: [{$ref: '#/components/parameters/OrderId'}]
    get: {tags: [Settlement], operationId: getOrder, x-permission: READER_SELF_OR_LIBRARIAN, responses: {'200': {$ref: '#/components/responses/Order'}, default: {$ref: '#/components/responses/Error'}}}
  /payment-simulator/results:
    post: {tags: [Settlement], operationId: scheduleSimulatedPayment, x-permission: CONTROLLED_TEST_OPERATOR, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Simulation'}, responses: {'200': {$ref: '#/components/responses/Simulation'}, default: {$ref: '#/components/responses/Error'}}}
  /payment-callbacks:
    post: {tags: [Settlement], operationId: applyPaymentCallback, x-permission: SIMULATOR_CREDENTIAL, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/PaymentCallback'}, responses: {'200': {$ref: '#/components/responses/Callback'}, default: {$ref: '#/components/responses/Error'}}}
  /orders/{orderId}/close:
    parameters: [{$ref: '#/components/parameters/OrderId'}]
    post: {tags: [Settlement], operationId: closeOrder, x-permission: READER_SELF_OR_LIBRARIAN_OR_ADMIN_OR_SYSTEM, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/Order'}, default: {$ref: '#/components/responses/Error'}}}
  /orders/{orderId}/refunds:
    parameters: [{$ref: '#/components/parameters/OrderId'}]
    post: {tags: [Settlement], operationId: requestRefund, summary: Retired refund operation, description: Refund requests are disabled for the current delivery scope. This endpoint always returns 422 MLS-PAY-009 and creates no review or refund record., deprecated: true, security: [], x-permission: UNSUPPORTED, responses: {'422': {$ref: '#/components/responses/Error'}}}
  /reconciliations:
    post: {tags: [Settlement], operationId: reconcileBusinessDate, summary: Retired reconciliation operation, description: Reconciliation is disabled for the current delivery scope. This endpoint always returns 422 MLS-PAY-009 and creates no reconciliation record., deprecated: true, security: [], x-permission: UNSUPPORTED, responses: {'422': {$ref: '#/components/responses/Error'}}}
  /reviews:
    get: {tags: [Review], operationId: listReviews, x-permission: LIBRARIAN_OR_ADMIN, parameters: [{$ref: '#/components/parameters/ReviewStatus'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/ReviewPage'}, default: {$ref: '#/components/responses/Error'}}}
    post: {tags: [Review], operationId: requestReview, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Review'}, responses: {'200': {$ref: '#/components/responses/ReviewReference'}, default: {$ref: '#/components/responses/Error'}}}
  /reviews/{reviewId}/decision:
    parameters: [{$ref: '#/components/parameters/ReviewId'}]
    post: {tags: [Review], operationId: decideReview, x-permission: ADMIN, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/ReviewDecision'}, responses: {'200': {$ref: '#/components/responses/ReviewDecision'}, default: {$ref: '#/components/responses/Error'}}}
  /dashboard/arrivals:
    get: {tags: [Query], operationId: getArrivalDashboard, x-permission: LIBRARIAN, parameters: [{$ref: '#/components/parameters/BusinessDateQuery'}], responses: {'200': {$ref: '#/components/responses/ArrivalDashboard'}, default: {$ref: '#/components/responses/Error'}}}
  /me/business:
    get: {tags: [Query], operationId: getMyBusiness, description: "group 与 kind 不能同时使用；group 只包含借阅与预约事务。", x-permission: READER, parameters: [{$ref: '#/components/parameters/BusinessKind'}, {$ref: '#/components/parameters/BusinessStatus'}, {$ref: '#/components/parameters/BusinessGroup'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/MyBusinessPage'}, default: {$ref: '#/components/responses/Error'}}}
  /notifications:
    get: {tags: [Delivery], operationId: listNotifications, x-permission: AUTHENTICATED_SELF, parameters: [{$ref: '#/components/parameters/UnreadOnly'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/NotificationPage'}, default: {$ref: '#/components/responses/Error'}}}
  /notifications/{notificationId}/read:
    parameters: [{$ref: '#/components/parameters/NotificationId'}]
    post: {tags: [Delivery], operationId: markNotificationRead, x-permission: AUTHENTICATED_SELF, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/Read'}, default: {$ref: '#/components/responses/Error'}}}
  /audit-events:
    get: {tags: [Delivery], operationId: listAuditEvents, x-permission: LIBRARIAN_OR_ADMIN, parameters: [{$ref: '#/components/parameters/RelatedId'}, {$ref: '#/components/parameters/ActorId'}, {$ref: '#/components/parameters/EventType'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/AuditPage'}, default: {$ref: '#/components/responses/Error'}}}
  /ai/sessions:
    post: {tags: [AI], operationId: startAiSession, security: [{}, {bearerAuth: []}], x-permission: PUBLIC_OR_AUTHENTICATED, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {$ref: '#/components/responses/AiSession'}, default: {$ref: '#/components/responses/Error'}}}
  /ai/sessions/{sessionId}/messages:
    parameters: [{$ref: '#/components/parameters/SessionId'}]
    post: {tags: [AI], operationId: sendAiMessage, security: [{bearerAuth: []}, {aiVisitorCookie: []}], x-permission: AI_SESSION_OWNER, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/AiMessage'}, responses: {'200': {$ref: '#/components/responses/AiTurn'}, default: {$ref: '#/components/responses/Error'}}}
  /ai/sessions/{sessionId}/events:
    parameters: [{$ref: '#/components/parameters/SessionId'}]
    get: {tags: [AI], operationId: listAiEvents, security: [{bearerAuth: []}, {aiVisitorCookie: []}], x-permission: AI_SESSION_OWNER_OR_ADMIN, parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/AiEventPage'}, default: {$ref: '#/components/responses/Error'}}}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: opaque}
    aiVisitorCookie: {type: apiKey, in: cookie, name: __Host-mls-ai-visitor, description: Browser-session visitor credential; HttpOnly, Secure, SameSite=Strict and Path=/; never returned in a response body.}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    RegistrationSessionCookie: {name: mls_registration_session, in: cookie, required: false, description: Server-issued HttpOnly SameSite=Strict browser-session cookie. Secure is set for HTTPS requests. The server issues it when absent and counts every registration request; clearing the browser session resets the session quota., schema: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}}
    Availability: {name: availability, in: query, required: false, description: Book-level availability derived from copy state., schema: {type: string, enum: [AVAILABLE, UNAVAILABLE, UNKNOWN]}}
    AccountId: {name: accountId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ReaderId: {name: readerId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    TitleId: {name: titleId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    CopyId: {name: copyId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    TxId: {name: txId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    FineId: {name: fineId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    OrderId: {name: orderId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ReviewId: {name: reviewId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    NotificationId: {name: notificationId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    SessionId: {name: sessionId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Search: {name: q, in: query, schema: {type: string, maxLength: 200}}
    Category: {name: category, in: query, schema: {type: string}}
    Role: {name: role, in: query, schema: {$ref: '#/components/schemas/Role'}}
    AccountStatus: {name: status, in: query, schema: {$ref: '#/components/schemas/AccountStatus'}}
    TitleIdQuery: {name: titleId, in: query, schema: {$ref: '#/components/schemas/Id'}}
    ReaderIdQuery: {name: readerId, in: query, schema: {$ref: '#/components/schemas/Id'}}
    CopyStatus: {name: status, in: query, schema: {$ref: '#/components/schemas/CopyStatus'}}
    FineStatus: {name: status, in: query, schema: {$ref: '#/components/schemas/FineStatus'}}
    ReviewStatus: {name: status, in: query, schema: {$ref: '#/components/schemas/ReviewStatus'}}
    FromDate: {name: from, in: query, required: true, schema: {$ref: '#/components/schemas/BusinessDate'}}
    ToDate: {name: to, in: query, required: true, schema: {$ref: '#/components/schemas/BusinessDate'}}
    BusinessDateQuery: {name: businessDate, in: query, required: true, schema: {$ref: '#/components/schemas/BusinessDate'}}
    BusinessKind: {name: kind, in: query, schema: {type: string, enum: [RESERVATION, LOAN, FINE, ORDER]}}
    BusinessStatus: {name: status, in: query, schema: {type: string}}
    BusinessGroup: {name: group, in: query, description: "独立分页分组；不能与 kind 同时使用。", schema: {type: string, enum: [CURRENT_LOANS, RESERVATIONS, HISTORY]}}
    UnreadOnly: {name: unreadOnly, in: query, schema: {type: boolean, default: false}}
    RelatedId: {name: relatedId, in: query, schema: {$ref: '#/components/schemas/Id'}}
    ActorId: {name: actorId, in: query, schema: {$ref: '#/components/schemas/Id'}}
    EventType: {name: eventType, in: query, schema: {type: string}}
  requestBodies:
    Registration: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationRequest'}}}}
    Session: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SessionRequest'}}}}
    AccountChange: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AccountChangeRequest'}}}}
    Reason: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReasonRequest'}}}}
    ReaderStatusChange: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReaderStatusChangeRequest'}}}}
    CreateTitle: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateTitleRequest'}}}}
    UpdateTitle: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateTitleRequest'}}}}
    VersionReason: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionReasonRequest'}}}}
    CreateCopy: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateCopyRequest'}}}}
    CopyAction: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CopyActionRequest'}}}}
    Reservation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReservationRequest'}}}}
    WalkInLoan: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WalkInLoanRequest'}}}}
    ClaimPickup: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClaimPickupRequest'}}}}
    ManualAction: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ManualActionRequest'}}}}
    Renewal: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RenewalRequest'}}}}
    Return: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReturnRequest'}}}}
    BusinessDate: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BusinessDateRequest'}}}}
    Simulation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SimulationRequest'}}}}
    PaymentCallback: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentCallbackRequest'}}}}
    Refund: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefundRequest'}}}}
    Review: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewRequest'}}}}
    ReviewDecision: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewDecisionRequest'}}}}
    AiMessage: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AiMessageRequest'}}}}
  responses:
    Error: {description: Stable error envelope, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    Registration: {$ref: '#/components/responses/RegistrationResponse'}
    Session: {$ref: '#/components/responses/SessionResponse'}
    Ended: {$ref: '#/components/responses/EndedResponse'}
    AccountPage: {$ref: '#/components/responses/AccountPageResponse'}
    ReviewReference: {$ref: '#/components/responses/ReviewReferenceResponse'}
    PasswordReset: {$ref: '#/components/responses/PasswordResetResponse'}
    Reader: {$ref: '#/components/responses/ReaderResponse'}
    TitlePage: {$ref: '#/components/responses/TitlePageResponse'}
    Title: {$ref: '#/components/responses/TitleResponse'}
    Removed: {$ref: '#/components/responses/RemovedResponse'}
    ReadingContent: {$ref: '#/components/responses/ReadingContentResponse'}
    Copy: {$ref: '#/components/responses/CopyResponse'}
    CopyPage: {$ref: '#/components/responses/CopyPageResponse'}
    ReservationCalendar: {$ref: '#/components/responses/ReservationCalendarResponse'}
    Reservation: {$ref: '#/components/responses/ReservationResponse'}
    Transaction: {$ref: '#/components/responses/TransactionResponse'}
    LoanBatch: {$ref: '#/components/responses/LoanBatchResponse'}
    Renewal: {$ref: '#/components/responses/RenewalResponse'}
    Return: {$ref: '#/components/responses/ReturnResponse'}
    ClosingRun: {$ref: '#/components/responses/ClosingRunResponse'}
    Reopened: {$ref: '#/components/responses/ReopenedResponse'}
    FinePage: {$ref: '#/components/responses/FinePageResponse'}
    OrderPage: {$ref: '#/components/responses/OrderPageResponse'}
    Order: {$ref: '#/components/responses/OrderResponse'}
    Simulation: {$ref: '#/components/responses/SimulationResponse'}
